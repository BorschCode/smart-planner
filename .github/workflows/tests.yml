name: tests

on:
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node Dependencies
        working-directory: backend
        run: npm ci

      - name: Install Dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Build Assets
        working-directory: backend
        run: npm run build

      - name: Copy Environment File
        working-directory: backend
        run: cp .env.example .env

      - name: Generate Application Key
        working-directory: backend
        run: php artisan key:generate

      # Migrations are not needed - tests use SQLite in-memory database
      # and Laravel's RefreshDatabase trait automatically runs migrations

      - name: Tests
        working-directory: backend
        run: ./vendor/bin/pest
