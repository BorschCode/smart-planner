openapi: 3.0.3
info:
  title: Smart Planner API
  description: API for managing habits and tasks
  version: 1.0.0
  contact:
    name: API Support
servers:
  - url: http://localhost:8043/api
    description: Local Development Server
  - url: /api
    description: API Server

tags:
  - name: Authentication
    description: Authentication endpoints
  - name: User
    description: User management endpoints
  - name: Habits
    description: Habit management endpoints

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      description: Create a new user account
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: Registration successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Registration successful
                  user:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticate a user and create a session
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login successful
                  user:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout user
      description: End the user's session
      operationId: logout
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logout successful
        '401':
          $ref: '#/components/responses/Unauthorized'

  /user:
    get:
      tags:
        - User
      summary: Get authenticated user
      description: Retrieve the currently authenticated user's information
      operationId: getUser
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /habits:
    get:
      tags:
        - Habits
      summary: Get all habits
      description: Retrieve a list of all habits for the authenticated user
      operationId: getHabits
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      tags:
        - Habits
      summary: Create a new habit
      description: Create a new habit for the authenticated user
      operationId: createHabit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitInput'
      responses:
        '201':
          description: Habit created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /habits/{id}:
    get:
      tags:
        - Habits
      summary: Get a specific habit
      description: Retrieve a specific habit by ID
      operationId: getHabit
      parameters:
        - $ref: '#/components/parameters/HabitId'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Habits
      summary: Update a habit
      description: Update an existing habit
      operationId: updateHabit
      parameters:
        - $ref: '#/components/parameters/HabitId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HabitInput'
      responses:
        '200':
          description: Habit updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Habit'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags:
        - Habits
      summary: Delete a habit
      description: Delete an existing habit
      operationId: deleteHabit
      parameters:
        - $ref: '#/components/parameters/HabitId'
      responses:
        '204':
          description: Habit deleted successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /habits/{id}/complete:
    post:
      tags:
        - Habits
      summary: Mark habit as complete
      description: Mark a habit as complete for today
      operationId: completeHabit
      parameters:
        - $ref: '#/components/parameters/HabitId'
      responses:
        '200':
          description: Habit marked as complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/HabitLog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter your bearer token in the format **Bearer &lt;token&gt;**

  parameters:
    HabitId:
      name: id
      in: path
      description: Habit ID
      required: true
      schema:
        type: integer
        format: int64
        example: 1

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: John Doe
        email:
          type: string
          format: email
          example: john@example.com
        email_verified_at:
          type: string
          format: date-time
          nullable: true
          example: '2024-01-01T12:00:00.000000Z'
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00.000000Z'

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: test@example.com
        password:
          type: string
          format: password
          example: password

    RegisterInput:
      type: object
      required:
        - name
        - email
        - password
        - password_confirmation
      properties:
        name:
          type: string
          maxLength: 255
          example: John Doe
        email:
          type: string
          format: email
          maxLength: 255
          example: john@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123
        password_confirmation:
          type: string
          format: password
          minLength: 8
          example: password123
          description: Must match the password field

    Habit:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        title:
          type: string
          example: Morning Exercise
        description:
          type: string
          nullable: true
          example: 30 minutes of cardio every morning
        type:
          type: string
          enum: [task, habit]
          example: habit
        frequency:
          type: string
          enum: [daily, weekly]
          example: daily
        is_active:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00.000000Z'
        habit_logs:
          type: array
          items:
            $ref: '#/components/schemas/HabitLog'

    HabitInput:
      type: object
      required:
        - title
        - type
        - frequency
      properties:
        title:
          type: string
          maxLength: 255
          example: Morning Exercise
        description:
          type: string
          maxLength: 1000
          nullable: true
          example: 30 minutes of cardio every morning
        type:
          type: string
          enum: [task, habit]
          example: habit
        frequency:
          type: string
          enum: [daily, weekly]
          example: daily
        is_active:
          type: boolean
          example: true

    HabitLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: 1
        habit_id:
          type: integer
          format: int64
          example: 1
        date:
          type: string
          format: date
          example: '2024-01-01'
        completed:
          type: boolean
          example: true
        created_at:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00.000000Z'
        updated_at:
          type: string
          format: date-time
          example: '2024-01-01T12:00:00.000000Z'

    Error:
      type: object
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string

  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Unauthenticated.

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: Resource not found.

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: The given data was invalid.
            errors:
              title:
                - The title field is required.
              type:
                - The selected type is invalid.
