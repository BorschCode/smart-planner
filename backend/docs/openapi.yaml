openapi: 3.0.3

info:
  title: Smart Planner API
  version: 1.0.0
  description: |
    Smart Planner API for SPA and Mobile clients.

    Authentication modes:
    - SPA uses Laravel Sanctum cookies
    - Mobile clients use Bearer tokens

    This OpenAPI file strictly matches:
    - Laravel FormRequests
    - Laravel JsonResources
    - Fortify authentication responses

servers:
  - url: http://localhost:8041

tags:
  - name: SPA Auth
    description: Cookie based authentication for React SPA
  - name: SPA User
    description: Current authenticated SPA user
  - name: Mobile Auth
    description: Token based authentication for Mobile apps and Postman
  - name: Habits
    description: |
      Habit management endpoints shared between:
      - SPA clients using Sanctum cookies
      - Mobile and API clients using Bearer tokens

      These endpoints require authentication but are transport-agnostic.
  - name: Two Factor
    description: Two factor authentication (Fortify)
  - name: Password
    description: Password reset flows (Fortify)
  - name: System
    description: CSRF and framework endpoints

components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: laravel-session
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    User:
      type: object
      required: [id, name, email, two_factor_enabled]
      properties:
        id:
          type: integer
          example: 20
        name:
          type: string
          example: "Test User"
        email:
          type: string
          format: email
        email_verified_at:
          type: string
          format: date-time
          nullable: true
        two_factor_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HabitLog:
      type: object
      required: [id, habit_id, date, completed]
      properties:
        id:
          type: integer
        habit_id:
          type: integer
        date:
          type: string
          format: date
        completed:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Habit:
      type: object
      required: [id, title, type, frequency, is_active]
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [task, habit]
        frequency:
          type: string
          enum: [daily, weekly]
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        habit_logs:
          type: array
          items:
            $ref: '#/components/schemas/HabitLog'
          nullable: true

    StoreHabitRequest:
      type: object
      required: [title, type, frequency]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [task, habit]
        frequency:
          type: string
          enum: [daily, weekly]
        is_active:
          type: boolean

    UpdateHabitRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
          enum: [task, habit]
        frequency:
          type: string
          enum: [daily, weekly]
        is_active:
          type: boolean

    ProfileUpdateRequest:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
        email:
          type: string
          format: email

paths:

  /sanctum/csrf-cookie:
    get:
      tags: [System]
      summary: Initialize CSRF cookie
      responses:
        204:
          description: CSRF cookie was issued

  /login:
    post:
      tags: [SPA Auth]
      summary: Login via SPA (cookies)
      responses:
        200:
          description: Authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  two_factor_required:
                    type: boolean
                  user:
                    $ref: '#/components/schemas/User'
        409:
          description: Two-factor authentication required

  /logout:
    post:
      tags: [SPA Auth]
      security:
        - sanctumCookie: []
      responses:
        200:
          description: Logged out

  /user:
    get:
      tags: [SPA User]
      security:
        - sanctumCookie: []
      responses:
        200:
          description: Current SPA user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /user/profile-information:
    put:
      tags: [SPA User]
      security:
        - sanctumCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateRequest'
      responses:
        200:
          description: Profile updated

  /forgot-password:
    post:
      tags: [Password]
      responses:
        200:
          description: Password reset email sent

  /reset-password:
    post:
      tags: [Password]
      responses:
        200:
          description: Password has been reset

  /two-factor-challenge:
    post:
      tags: [Two Factor]
      responses:
        200:
          description: Two-factor verified

  /user/two-factor-authentication:
    post:
      tags: [Two Factor]
      security:
        - sanctumCookie: []
      responses:
        200:
          description: Two-factor enabled
    delete:
      tags: [Two Factor]
      security:
        - sanctumCookie: []
      responses:
        204:
          description: Two-factor disabled

  /user/two-factor-qr-code:
    get:
      tags: [Two Factor]
      security:
        - sanctumCookie: []
      responses:
        200:
          description: QR code

  /user/two-factor-recovery-codes:
    get:
      tags: [Two Factor]
      security:
        - sanctumCookie: []
      responses:
        200:
          description: Recovery codes
    post:
      tags: [Two Factor]
      security:
        - sanctumCookie: []
      responses:
        200:
          description: Recovery codes regenerated

  /user/two-factor-secret-key:
    get:
      tags: [Two Factor]
      security:
        - sanctumCookie: []
      responses:
        200:
          description: Secret key

  /api/token/login:
    post:
      tags: [Mobile Auth]
      summary: Login and receive token
      responses:
        200:
          description: Token issued

  /api/user:
    get:
      tags: [ User ]
      summary: Get current authenticated user
      description: |
        Returns the currently authenticated user.

        Authentication:
        - SPA clients use Laravel Sanctum session cookies
        - Mobile clients use Bearer token

        This endpoint works for both authentication modes.
      security:
        - sanctumCookie: [ ]
        - bearerAuth: [ ]
      responses:
        200:
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          description: Not authenticated

  /api/habits:
    get:
      tags: [Habits]
      security:
        - bearerAuth: []
      responses:
        200:
          description: List of habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Habit'
    post:
      tags: [Habits]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreHabitRequest'
      responses:
        201:
          description: Habit created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'

  /api/habits/{id}:
    get:
      tags: [Habits]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Habit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
    put:
      tags: [Habits]
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHabitRequest'
      responses:
        200:
          description: Habit updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Habit'
    delete:
      tags: [Habits]
      security:
        - bearerAuth: []
      responses:
        204:
          description: Habit deleted

  /api/habits/{id}/complete:
    post:
      tags: [Habits]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Habit marked as completed
