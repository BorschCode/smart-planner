openapi: 3.0.3

info:
  title: Smart Planner API
  description: |
    Authentication model:
      • SPA uses Sanctum cookies
      • Mobile & Postman use Bearer tokens
  version: 1.0.0

servers:
  - url: http://localhost:8041

tags:
  - name: SPA Auth
    description: Cookie based authentication for React SPA

  - name: SPA User
    description: Current authenticated SPA user

  - name: Mobile Auth
    description: Token based authentication for Mobile apps and Postman

  - name: Mobile Habits
    description: Habit management for Mobile API

  - name: Two Factor
    description: Two factor authentication (Fortify + Sanctum)

  - name: Password
    description: Password reset flows (Fortify)

  - name: System
    description: CSRF, health, and framework endpoints

  - name: Docs
    description: Swagger documentation and OpenAPI spec

components:
  securitySchemes:
    sanctumCookie:
      type: apiKey
      in: cookie
      name: laravel-session
    bearerAuth:
      type: http
      scheme: bearer

paths:

  # ---------------- SYSTEM ----------------

  /sanctum/csrf-cookie:
    get:
      tags: [System]
      summary: Initialize CSRF cookie
      responses:
        204:
          description: Cookie issued

  /up:
    get:
      tags: [System]
      summary: Health check
      responses:
        200:
          description: OK

  # ---------------- SPA AUTH ----------------

  /login:
    post:
      tags: [SPA Auth]
      summary: SPA login
      responses:
        200:
          description: Logged in

  /logout:
    post:
      tags: [SPA Auth]
      security:
        - sanctumCookie: []
      summary: SPA logout
      responses:
        204:
          description: Logged out

  /user:
    get:
      tags: [SPA User]
      security:
        - sanctumCookie: []
      summary: Current SPA user
      responses:
        200:
          description: User

  # ---------------- PASSWORD ----------------

  /forgot-password:
    post:
      tags: [Password]
      summary: Send password reset link
      responses:
        200:
          description: Reset email sent

  /reset-password:
    post:
      tags: [Password]
      summary: Reset password
      responses:
        200:
          description: Password reset

  # ---------------- TWO FACTOR (SPA) ----------------

  /two-factor-challenge:
    post:
      tags: [Two Factor]
      summary: Verify 2FA code
      responses:
        200:
          description: 2FA verified

  /user/two-factor-authentication:
    post:
      tags: [Two Factor]
      security:
        - sanctumCookie: []
      summary: Enable 2FA
      responses:
        200:
          description: Enabled

    delete:
      tags: [Two Factor]
      security:
        - sanctumCookie: []
      summary: Disable 2FA
      responses:
        204:
          description: Disabled

  /user/two-factor-qr-code:
    get:
      tags: [Two Factor]
      security:
        - sanctumCookie: []
      summary: Get QR code
      responses:
        200:
          description: QR code

  /user/two-factor-recovery-codes:
    get:
      tags: [Two Factor]
      security:
        - sanctumCookie: []
      summary: Recovery codes
      responses:
        200:
          description: Codes

    post:
      tags: [Two Factor]
      security:
        - sanctumCookie: []
      summary: Regenerate recovery codes
      responses:
        200:
          description: Regenerated

  /user/two-factor-secret-key:
    get:
      tags: [Two Factor]
      security:
        - sanctumCookie: []
      summary: Secret key
      responses:
        200:
          description: Secret

  # ---------------- MOBILE AUTH ----------------

  /api/token/login:
    post:
      tags: [Mobile Auth]
      summary: Login and get token
      responses:
        200:
          description: Bearer token

  /api/user:
    get:
      tags: [Mobile Auth]
      security:
        - bearerAuth: []
      summary: Current mobile user
      responses:
        200:
          description: User

  # ---------------- MOBILE HABITS ----------------

  /api/habits:
    get:
      tags: [Mobile Habits]
      security:
        - bearerAuth: []
      summary: List habits
      responses:
        200:
          description: Habits

    post:
      tags: [Mobile Habits]
      security:
        - bearerAuth: []
      summary: Create habit
      responses:
        201:
          description: Created

  /api/habits/{id}:
    get:
      tags: [Mobile Habits]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        200:
          description: Habit

    put:
      tags: [Mobile Habits]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Updated

    delete:
      tags: [Mobile Habits]
      security:
        - bearerAuth: []
      responses:
        204:
          description: Deleted

  /api/habits/{id}/complete:
    post:
      tags: [Mobile Habits]
      security:
        - bearerAuth: []
      responses:
        200:
          description: Completed

  # ---------------- DOCS ----------------

  /docs:
    get:
      tags: [Docs]
      summary: Swagger UI
      responses:
        200:
          description: OK

  /docs/openapi.yaml:
    get:
      tags: [Docs]
      summary: OpenAPI spec
      responses:
        200:
          description: OK
